# Lint and unit tests. The tests are deliberately cluster-free: SSE parsing,
# SQL statement splitting and placeholder rendering are pure functions, so CI
# needs neither Kafka nor Flink.
#
# TRIGGERS ARE OFF ON PURPOSE. This runs only when started from the Actions
# tab. Uncomment the push / pull_request blocks to enable them.
name: ci

on:
  workflow_dispatch:

  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (without Flink, which the unit tests do not need)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest ruff PyYAML requests

      - name: Ruff
        run: ruff check ingest flink_jobs tests

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
