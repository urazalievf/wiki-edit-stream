# Project-local Kafka broker (KRaft - no ZooKeeper).
#
# Self-contained on purpose: data lives under .kafka-data/ in the repo, so
# starting this broker never touches a system-wide Kafka install and
# `make kafka-reset` is safe.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093
controller.listener.names=CONTROLLER
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
# Both listeners are advertised explicitly as 127.0.0.1: on some machines
# 'localhost' does not resolve for the controller quorum endpoint.
advertised.listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

log.dirs=.kafka-data

# Single node, so nothing can be replicated. These would be 3 in any real
# deployment; they are 1 here only because there is one broker.
num.partitions=3
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1

# A local demo should not fill the disk if it is left running.
log.retention.hours=6
log.segment.bytes=134217728
